name: CI - Foodie

# Confere que o código está são, no PR (antes do merge) e na main (depois).
# O deploy continua sendo o release.ps1 (PC -> VPS), de propósito: ele é o
# processo provado, com backup e rollback automático.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # NÃO cancela: dois merges colados no `main` faziam a validação do primeiro ser
  # cancelada pelo segundo (15/10/2026), e o deploy podia publicar sem ela. Agora a
  # validação do `main` sempre conclui; a fila é serial, uma por ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verificação (Java, tipos, build, app da cozinha)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.21.0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # O verify roda o Maven apontando para este cache local (.m2-cache), que
      # não é versionado porque tem 102 MB. Guardamos entre execuções, com a
      # chave amarrada ao pom.xml.
      - uses: actions/cache@v6
        with:
          path: platform/apps/api-java/.m2-cache
          key: m2-${{ hashFiles('platform/apps/api-java/pom.xml') }}
          restore-keys: m2-

      - name: Dependências (pnpm)
        run: pnpm install --frozen-lockfile

      # Falha só em vulnerabilidade crítica de produção; as altas transitivas do
      # tooling da cozinha ainda não têm versão corrigida publicada.
      - name: Auditoria de dependências (crítica)
        run: pnpm audit --prod --audit-level critical

      # O deploy reinicia o Prometheus com o alerts.yml do release; uma regra inválida o derrubaria.
      # Mesma imagem do monitoring/docker-compose.yml.
      - name: Regras de alerta (promtool)
        run: docker run --rm --entrypoint promtool -v "$PWD/monitoring:/m:ro" prom/prometheus:v2.55.0 check rules /m/alerts.yml

      # O verify integrado sobe um banco efêmero (docker-compose.test.yml) e lê as
      # senhas de platform/.env e platform/tools/.env, que não são versionados. São
      # descartáveis: o banco nasce e morre dentro do job. Os secrets são opcionais —
      # sem eles valem os valores de CI abaixo.
      - name: Ambiente do banco efêmero
        run: |
          {
            echo "DB_PASSWORD=${DB_PASSWORD}"
            echo "DB_ROOT_PASSWORD=${DB_ROOT_PASSWORD}"
          } > .env
          echo "DEMO_PASSWORD=${DEMO_PASSWORD}" > tools/.env
        env:
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD || 'foodie-ci-test' }}
          DB_ROOT_PASSWORD: ${{ secrets.CI_DB_ROOT_PASSWORD || 'foodie-ci-test-root' }}
          DEMO_PASSWORD: ${{ secrets.CI_DEMO_PASSWORD || 'foodie-ci-demo' }}

      - name: Verificação
        run: pnpm verify
        env:
          # No PC o Maven roda offline, apoiado no cache local. Num runner limpo
          # esse cache nasce vazio, então aqui o Maven baixa o que precisa.
          VERIFY_ONLINE: '1'
          # Liga os smokes de integração: banco + API efêmeros, seed demonstrativo
          # e os fluxos de carrinho, exceções, contas e cobertura por CEP.
          VERIFY_INTEGRATION: '1'

  # Auditoria das dependências do Java (pom.xml), mesmo critério do `pnpm audit`:
  # falha só em vulnerabilidade CRÍTICA. Job separado de propósito: roda em
  # paralelo (não alonga a `Verificação`) e uma indisponibilidade do OSV/deps.dev
  # não trava o merge, a menos que o dono o marque como requisito da `main`.
  # OSV-Scanner (Google): sem chave de API nem segredo; resolve as dependências
  # transitivas pelo deps.dev e consulta a base OSV. Imagem fixada por versão.
  audit-java:
    name: Auditoria Java (crítica)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: OSV-Scanner no pom.xml (falha só em crítica)
        env:
          # Críticas aceitas como risco documentado (decisão do dono, 11/11/2026).
          # As duas são do spring-webmvc 6.2.19 e só têm correção na 7.0.9
          # (Spring Boot 4); a API não usa XsltView nem SSE com fragmentos de view.
          # Rever ao migrar para o Spring Boot 4 ou se sair correção na linha 6.2.
          #   GHSA-j9f9-w8pj-32f8: corrupção do stream SSE com fragmentos de view
          #   GHSA-pc63-qcmh-9cmg: XsltView com mapeamento /** (SSRF e RCE)
          CRITICAS_ACEITAS: '["GHSA-j9f9-w8pj-32f8","GHSA-pc63-qcmh-9cmg"]'
        run: |
          set -u
          rc=0
          docker run --rm -v "$PWD/platform/apps/api-java/pom.xml:/src/pom.xml:ro" \
            ghcr.io/google/osv-scanner:v2.7.1 \
            scan source --format json --lockfile=/src/pom.xml > osv.json || rc=$?
          # 0 = limpo, 1 = achou vulnerabilidades (avaliadas abaixo); >=2 = erro do scanner.
          if [ "$rc" -ge 2 ]; then
            echo "::error::osv-scanner falhou (código $rc)"
            exit "$rc"
          fi
          total=$(jq '[.results[]?.packages[]?.vulnerabilities[]?.id] | unique | length' osv.json)
          # Crítica = severidade GHSA "CRITICAL" ou pontuação CVSS do grupo >= 9.0.
          criticas=$(jq -r --argjson aceitas "$CRITICAS_ACEITAS" '
            [ .results[]?.packages[]? as $p
              | ($p.vulnerabilities // [])[]
              | select((.database_specific.severity // "") == "CRITICAL")
              | select(([.id] + (.aliases // [])) | any(. as $i | $aceitas | index($i)) | not)
              | "\($p.package.name)@\($p.package.version) \(.id)" ] as $a
            | [ .results[]?.packages[]? as $p
              | ($p.groups // [])[]
              | select(((.max_severity // "0") | tonumber? // 0) >= 9)
              | select(((.ids // []) + (.aliases // [])) | any(. as $i | $aceitas | index($i)) | not)
              | "\($p.package.name)@\($p.package.version) \(.ids[0])" ] as $b
            | ($a + $b) | unique | .[]' osv.json)
          echo "Vulnerabilidades distintas (todos os níveis): $total"
          echo "Críticas aceitas como risco documentado (não falham o job): $CRITICAS_ACEITAS"
          if [ -n "$criticas" ]; then
            echo "::error::Vulnerabilidade crítica nas dependências Java:"
            echo "$criticas"
            exit 1
          fi
          echo "Nenhuma vulnerabilidade crítica."
