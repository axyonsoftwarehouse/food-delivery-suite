# Dependabot: alertas de segurança e atualizações de versão.
# Semanal, poucos PRs abertos e atualizações menores/patch agrupadas, para não
# inundar a equipe. Sem auto-merge: a `main` exige CI verde + 1 aprovação.
version: 2
updates:
  # pnpm (workspace em platform/: apps/*, packages/*, tools)
  - package-ecosystem: npm
    directory: /platform
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    # O app da cozinha (Expo) só funciona com as versões do SDK do Expo em uso: esses pacotes
    # sobem todos juntos, na troca de SDK (`npx expo install --fix`), e não pelo Dependabot.
    # O TypeScript só sobe de versão maior à mão: o Expo fixa a do app da cozinha.
    ignore:
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "jest-expo"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native/*"
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Java (Maven)
  - package-ecosystem: maven
    directory: /platform/apps/api-java
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      maven-minor-patch:
        update-types: [minor, patch]
    # Spring Boot 4 é uma migração própria, combinada para depois do lançamento (checklist, G2).
    ignore:
      - dependency-name: "org.springframework.boot:spring-boot-starter-parent"
        update-types: ["version-update:semver-major"]

  # Actions dos workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    commit-message:
      prefix: "ci"
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  # Imagens base dos Dockerfiles
  - package-ecosystem: docker
    directories:
      - /platform/apps/api-java
      - /platform/apps/web
      - /platform/deploy
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
