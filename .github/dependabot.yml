# Dependabot: alertas de segurança e atualizações de versão.
# Semanal, poucos PRs abertos e atualizações menores/patch agrupadas, para não
# inundar a equipe. Sem auto-merge: a `main` exige CI verde + 1 aprovação.
version: 2
updates:
  # pnpm (workspace em platform/: apps/*, packages/*, tools)
  - package-ecosystem: npm
    directory: /platform
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  # Java (Maven)
  - package-ecosystem: maven
    directory: /platform/apps/api-java
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      maven-minor-patch:
        update-types: [minor, patch]

  # Actions dos workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    commit-message:
      prefix: "ci"
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  # Imagens base dos Dockerfiles
  - package-ecosystem: docker
    directories:
      - /platform/apps/api-java
      - /platform/apps/web
      - /platform/deploy
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
