groups:
  - name: foodie
    rules:
      - alert: FoodieApiDown
        expr: up{job="foodie-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "API Foodie fora do ar"
          description: "Sem resposta de métricas em api:4001 há mais de 1 minuto."

      - alert: FoodieReadinessDown
        expr: probe_success{job="foodie-readiness"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "API Foodie não está pronta (/ready)"
          description: "O /ready não respondeu 200 — banco inacessível ou schema desatualizado."

      - alert: FoodieWebDown
        expr: probe_success{job="foodie-web"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Site Foodie fora do ar"
          description: "O site em web:3001 não respondeu 200."

      - alert: FoodieDatabaseDown
        expr: probe_success{job="foodie-db"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Banco MariaDB inacessível"
          description: "A porta db:3306 não aceitou conexão."

      - alert: FoodieHighErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            / clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 0.2) > 0.02
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Erros 5xx acima de 2% na API"
          description: "Mais de 2% das requisições retornaram 5xx nos últimos 5 minutos."

      - alert: FoodieHighLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_server_requests_seconds_bucket[5m])) by (le)) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Latência p95 acima de 800 ms"
          description: "O p95 das requisições passou de 800 ms nos últimos 5 minutos."

      - alert: FoodieDatabasePoolSaturated
        expr: hikaricp_connections_active / clamp_min(hikaricp_connections_max, 1) > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Pool de conexões do banco quase esgotado"
          description: "Mais de 90% do pool Hikari está em uso."

      # Notificação do provedor recusada: desde a #71 (21/10/2026) todo webhook do Mercado Pago voltou 401
      # por um dia e meio sem ninguém saber — o FoodieHighErrorRate só conta 5xx. Uma recusa avulsa pode ser
      # robô; duas em 15 minutos já é o provedor reenviando (segredo trocado, janela, formato do provedor).
      # O segundo ramo cobre a série que nasce na primeira recusa (depois de cada deploy): o `increase` não
      # conta esse salto inicial — sozinho, ele mostrou 2,1 para as 8 recusas do pedido #98 (23/10).
      # Conferido contra o histórico de 23/10: dispara às 01:21 (#98), 05:01 e 05:30 (#100) e fica quieto fora.
      - alert: FoodieWebhookRejected
        expr: |
          (sum(increase(http_server_requests_seconds_count{uri=~"/webhooks/.*",status="401"}[15m])) >= 2)
          or
          (sum(http_server_requests_seconds_count{uri=~"/webhooks/.*",status="401"}
               unless http_server_requests_seconds_count{uri=~"/webhooks/.*",status="401"} offset 15m) >= 2)
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Webhook de pagamento recusado (401)"
          description: "Cerca de {{ $value | printf \"%.0f\" }} notificações recusadas em 15 min: pagamentos online e estornos não estão sendo confirmados. Veja `docker compose logs api | grep 'Webhook do Mercado Pago recusado'`."
