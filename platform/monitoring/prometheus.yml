global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: foodie-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['api:4001']

  - job_name: foodie-readiness
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['http://api:4001/ready']
        labels:
          service: api-readiness
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: foodie-web
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['http://web:3001']
        labels:
          service: web
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: foodie-db
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets: ['db:3306']
        labels:
          service: db
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
