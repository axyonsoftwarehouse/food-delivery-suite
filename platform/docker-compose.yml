services:
  api-java:
    profiles: ["java"]
    build: ./apps/api-java
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 4001
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
      SENTRY_API_URL: ${SENTRY_API_URL:-https://sentry.io/api/0}
      SENTRY_ORG_SLUG: ${SENTRY_ORG_SLUG:-axyon-software-house}
      SENTRY_PROJECTS: ${SENTRY_PROJECTS:-foodie-api,foodie-web}
      SENTRY_API_TOKEN: ${SENTRY_API_TOKEN:-}
      SENTRY_CACHE_SECONDS: ${SENTRY_CACHE_SECONDS:-60}
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: foodie
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in platform/.env}
      DB_NAME: foodie_platform
      MAPBOX_TOKEN: ${MAPBOX_TOKEN:-}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:-}
      MERCADOPAGO_BASE_URL: ${MERCADOPAGO_BASE_URL:-https://api.mercadopago.com}
      MERCADOPAGO_CARD_3DS: ${MERCADOPAGO_CARD_3DS:-on_fraud_risk}
      MERCADOPAGO_CLIENT_ID: ${MERCADOPAGO_CLIENT_ID:-}
      MERCADOPAGO_CLIENT_SECRET: ${MERCADOPAGO_CLIENT_SECRET:-}
      MERCADOPAGO_OAUTH_REDIRECT_URI: ${MERCADOPAGO_OAUTH_REDIRECT_URI:-}
      PAYMENTS_TOKEN_KEY: ${PAYMENTS_TOKEN_KEY:-}
      PAYMENTS_DEFAULT_PROVIDER: ${PAYMENTS_DEFAULT_PROVIDER:-mercadopago}
      PAYMENTS_ACCOUNT_RETURN_URL: ${PAYMENTS_ACCOUNT_RETURN_URL:-}
      PAYMENTS_ALLOW_DIRECT_ONLINE_CHARGES: ${PAYMENTS_ALLOW_DIRECT_ONLINE_CHARGES:-false}
      PAYMENTS_REQUIRE_TEST_ACCOUNTS: ${PAYMENTS_REQUIRE_TEST_ACCOUNTS:-true}
      SUBSCRIPTIONS_ALLOW_REAL_CHARGES: ${SUBSCRIPTIONS_ALLOW_REAL_CHARGES:-false}
      SUBSCRIPTIONS_ACCOUNT_ACCESS_TOKEN: ${SUBSCRIPTIONS_ACCOUNT_ACCESS_TOKEN:-}
      SUBSCRIPTIONS_ACCOUNT_PUBLIC_KEY: ${SUBSCRIPTIONS_ACCOUNT_PUBLIC_KEY:-}
      SUBSCRIPTIONS_TRIAL_DAYS: ${SUBSCRIPTIONS_TRIAL_DAYS:-15}
      SUBSCRIPTIONS_REMIND_BEFORE_DAYS: ${SUBSCRIPTIONS_REMIND_BEFORE_DAYS:-3}
      SUBSCRIPTIONS_GRACE_DAYS: ${SUBSCRIPTIONS_GRACE_DAYS:-5}
      SUBSCRIPTIONS_RETRY_EVERY_DAYS: ${SUBSCRIPTIONS_RETRY_EVERY_DAYS:-2}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:3001}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-true}
      SESSION_DAYS: ${SESSION_DAYS:-3}
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-1440}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_BASE_URL: ${GOOGLE_BASE_URL:-https://oauth2.googleapis.com}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      FACEBOOK_BASE_URL: ${FACEBOOK_BASE_URL:-https://graph.facebook.com}
      OTP_TTL_MINUTES: ${OTP_TTL_MINUTES:-10}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
      SMS_PROVIDER: ${SMS_PROVIDER:-local}
      SMS_LOG_BODY: ${SMS_LOG_BODY:-false}
      SMS_FROM: ${SMS_FROM:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_BASE_URL: ${TWILIO_BASE_URL:-https://api.twilio.com}
      SMS_GENERIC_URL: ${SMS_GENERIC_URL:-}
      SMS_GENERIC_TOKEN: ${SMS_GENERIC_TOKEN:-}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-log}
      MAIL_LOG_BODY: ${MAIL_LOG_BODY:-false}
      MAIL_FROM: ${MAIL_FROM:-}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:-true}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:-true}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      MAPBOX_BASE_URL: ${MAPBOX_BASE_URL:-https://api.mapbox.com}
      MERCADOPAGO_AUTH_BASE_URL: ${MERCADOPAGO_AUTH_BASE_URL:-https://auth.mercadopago.com.br}
      MERCADOPAGO_WEBHOOK_TOLERANCE_SECONDS: ${MERCADOPAGO_WEBHOOK_TOLERANCE_SECONDS:-300}
      STORAGE_MAX_IMAGE_BYTES: ${STORAGE_MAX_IMAGE_BYTES:-5242880}
      STORAGE_MAX_DOCUMENT_BYTES: ${STORAGE_MAX_DOCUMENT_BYTES:-10485760}
      WEBPUSH_PUBLIC_KEY: ${WEBPUSH_PUBLIC_KEY:-}
      WEBPUSH_PRIVATE_KEY: ${WEBPUSH_PRIVATE_KEY:-}
      WEBPUSH_SUBJECT: ${WEBPUSH_SUBJECT:-mailto:contato@foodie.local}
      FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON:-}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:-http://127.0.0.1:4001}
      STORAGE_LOCAL_DIR: /data/uploads
    ports:
      - "127.0.0.1:4001:4001"
    volumes:
      - foodie_uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: foodie_platform
      MARIADB_USER: foodie
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in platform/.env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in platform/.env}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - foodie_platform_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Sem isto, depois de reiniciar o Docker só a API voltava e ficava em loop sem achar o host `db`.
    restart: unless-stopped

volumes:
  foodie_platform_db:
  foodie_uploads:
