services:
  api-java:
    profiles: ["java"]
    build: ./apps/api-java
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 4001
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: foodie
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in platform/.env}
      DB_NAME: foodie_platform
      MAPBOX_TOKEN: ${MAPBOX_TOKEN:-}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:-}
      MERCADOPAGO_BASE_URL: ${MERCADOPAGO_BASE_URL:-https://api.mercadopago.com}
      MERCADOPAGO_CLIENT_ID: ${MERCADOPAGO_CLIENT_ID:-}
      MERCADOPAGO_CLIENT_SECRET: ${MERCADOPAGO_CLIENT_SECRET:-}
      MERCADOPAGO_OAUTH_REDIRECT_URI: ${MERCADOPAGO_OAUTH_REDIRECT_URI:-}
      PAYMENTS_TOKEN_KEY: ${PAYMENTS_TOKEN_KEY:-}
      PAYMENTS_DEFAULT_PROVIDER: ${PAYMENTS_DEFAULT_PROVIDER:-mercadopago}
      PAYMENTS_ACCOUNT_RETURN_URL: ${PAYMENTS_ACCOUNT_RETURN_URL:-}
      PAYMENTS_ALLOW_DIRECT_ONLINE_CHARGES: ${PAYMENTS_ALLOW_DIRECT_ONLINE_CHARGES:-false}
      PAYMENTS_REQUIRE_TEST_ACCOUNTS: ${PAYMENTS_REQUIRE_TEST_ACCOUNTS:-true}
      WEBPUSH_PUBLIC_KEY: ${WEBPUSH_PUBLIC_KEY:-}
      WEBPUSH_PRIVATE_KEY: ${WEBPUSH_PRIVATE_KEY:-}
      WEBPUSH_SUBJECT: ${WEBPUSH_SUBJECT:-mailto:contato@foodie.local}
      FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON:-}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:-http://127.0.0.1:4001}
      STORAGE_LOCAL_DIR: /data/uploads
    ports:
      - "127.0.0.1:4001:4001"
    volumes:
      - foodie_uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: foodie_platform
      MARIADB_USER: foodie
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in platform/.env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in platform/.env}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - foodie_platform_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  foodie_platform_db:
  foodie_uploads:
