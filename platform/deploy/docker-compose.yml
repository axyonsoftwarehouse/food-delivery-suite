name: foodie-staging

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: foodie_platform
      MARIADB_USER: foodie
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in platform/deploy/.env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in platform/deploy/.env}
    volumes:
      - foodie_platform_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

  migrate:
    build: ../apps/api-java
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 4001
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: foodie
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in platform/deploy/.env}
      DB_NAME: foodie_platform
      SPRING_FLYWAY_ENABLED: "true"
      MIGRATE_ONLY: "true"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: ../apps/api-java
    restart: unless-stopped
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 4001
      COOKIE_SECURE: "true"
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: foodie
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in platform/deploy/.env}
      DB_NAME: foodie_platform
      MAPBOX_TOKEN: ${MAPBOX_TOKEN:-}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:-}
      MERCADOPAGO_BASE_URL: ${MERCADOPAGO_BASE_URL:-https://api.mercadopago.com}
      MERCADOPAGO_CLIENT_ID: ${MERCADOPAGO_CLIENT_ID:-}
      MERCADOPAGO_CLIENT_SECRET: ${MERCADOPAGO_CLIENT_SECRET:-}
      MERCADOPAGO_OAUTH_REDIRECT_URI: ${MERCADOPAGO_OAUTH_REDIRECT_URI:-https://api.${FOODIE_DOMAIN:-staging.2.29.42.104.sslip.io}/payments/mercadopago/oauth/callback}
      PAYMENTS_TOKEN_KEY: ${PAYMENTS_TOKEN_KEY:-}
      PAYMENTS_DEFAULT_PROVIDER: ${PAYMENTS_DEFAULT_PROVIDER:-mercadopago}
      PAYMENTS_ACCOUNT_RETURN_URL: ${PAYMENTS_ACCOUNT_RETURN_URL:-https://${FOODIE_DOMAIN:-staging.2.29.42.104.sslip.io}/painel/configuracoes}
      PAYMENTS_ALLOW_DIRECT_ONLINE_CHARGES: ${PAYMENTS_ALLOW_DIRECT_ONLINE_CHARGES:-false}
      PAYMENTS_REQUIRE_TEST_ACCOUNTS: ${PAYMENTS_REQUIRE_TEST_ACCOUNTS:-true}
      WEBPUSH_PUBLIC_KEY: ${WEBPUSH_PUBLIC_KEY:-}
      WEBPUSH_PRIVATE_KEY: ${WEBPUSH_PRIVATE_KEY:-}
      WEBPUSH_SUBJECT: ${WEBPUSH_SUBJECT:-mailto:contato@foodie.local}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_DIR: /data/uploads
      STORAGE_PUBLIC_BASE_URL: https://api.${FOODIE_DOMAIN:-staging.2.29.42.104.sslip.io}
      PUBLIC_BASE_URL: https://cliente.${FOODIE_DOMAIN:-staging.2.29.42.104.sslip.io}
    volumes:
      - foodie_uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: http://api:4001
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4001
    depends_on:
      api:
        condition: service_healthy

  seed:
    profiles: ["tools"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.seed
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: foodie
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in platform/deploy/.env}
      DB_NAME: foodie_platform
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  caddy:
    image: caddy:2
    profiles: ["public"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      FOODIE_DOMAIN: ${FOODIE_DOMAIN:?Set FOODIE_DOMAIN in platform/deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - foodie_caddy_data:/data
      - foodie_caddy_config:/config
    depends_on:
      web:
        condition: service_started

volumes:
  foodie_platform_data:
  foodie_caddy_data:
  foodie_caddy_config:
  foodie_uploads:
