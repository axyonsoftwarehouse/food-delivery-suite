server:
  port: ${API_PORT:4001}
  address: ${API_HOST:127.0.0.1}
app:
  cookie-secure: ${COOKIE_SECURE:true}
  public-base-url: ${PUBLIC_BASE_URL:http://127.0.0.1:3001}
  migrate-only: ${MIGRATE_ONLY:false}
  payments:
    default-provider: ${PAYMENTS_DEFAULT_PROVIDER:mercadopago}
    # Caminho de teste/homologação: permite criar cobrança online nova (hoje o produto exige
    # recebimento direto pelo restaurante). Em produção fica desligado.
    allow-direct-online-charges: ${PAYMENTS_ALLOW_DIRECT_ONLINE_CHARGES:false}
    # Chave AES-256 (32 bytes em base64) que cifra os tokens do Mercado Pago de cada loja.
    # Gerar com: openssl rand -base64 32. Sem ela, a vinculação de contas responde 503.
    token-key: ${PAYMENTS_TOKEN_KEY:}
    # Página do painel da loja para onde o navegador volta depois da autorização.
    account-return-url: ${PAYMENTS_ACCOUNT_RETURN_URL:http://127.0.0.1:3001/painel/configuracoes}
    # Ambiente de testes: só aceita conectar usuários de teste do Mercado Pago (evita ligar uma conta
    # de dinheiro real numa loja de teste — aconteceu no staging em 06/10/2026). Produção: false.
    require-test-accounts: ${PAYMENTS_REQUIRE_TEST_ACCOUNTS:false}
  subscriptions:
    # Cobrança real da assinatura da loja (receita da Foodie). Desligada por padrão; ligada no staging
    # com a conta de teste. Sem a flag ou sem token, o job não cobra de verdade.
    allow-real-charges: ${SUBSCRIPTIONS_ALLOW_REAL_CHARGES:false}
    account-access-token: ${SUBSCRIPTIONS_ACCOUNT_ACCESS_TOKEN:}
    account-public-key: ${SUBSCRIPTIONS_ACCOUNT_PUBLIC_KEY:}
    # Duração padrão do teste grátis (dias) quando o admin não informar outra. Decisão de 15/10/2026.
    trial-days: ${SUBSCRIPTIONS_TRIAL_DAYS:15}
    # Antecedência da cobrança, carência após o vencimento e intervalo da nova tentativa (dias).
    remind-before-days: ${SUBSCRIPTIONS_REMIND_BEFORE_DAYS:3}
    grace-days: ${SUBSCRIPTIONS_GRACE_DAYS:5}
    retry-every-days: ${SUBSCRIPTIONS_RETRY_EVERY_DAYS:2}
  sentry:
    api-url: ${SENTRY_API_URL:https://sentry.io/api/0}
    org-slug: ${SENTRY_ORG_SLUG:axyon-software-house}
    projects: ${SENTRY_PROJECTS:foodie-api,foodie-web}
    api-token: ${SENTRY_API_TOKEN:}
    cache-seconds: ${SENTRY_CACHE_SECONDS:60}
  auth:
    require-email-verification: ${REQUIRE_EMAIL_VERIFICATION:true}
    # Sessão absoluta; encurtou de 7 para 3 dias. O usuário refaz o login quando expirar.
    session-days: ${SESSION_DAYS:3}
    # Sem uso por este tempo, a sessão expira mesmo antes do prazo absoluto.
    session-idle-minutes: ${SESSION_IDLE_MINUTES:1440}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      base-url: ${GOOGLE_BASE_URL:https://oauth2.googleapis.com}
    facebook:
      app-id: ${FACEBOOK_APP_ID:}
      # Necessário para conferir que o token foi emitido para este app (debug_token + appsecret_proof).
      app-secret: ${FACEBOOK_APP_SECRET:}
      base-url: ${FACEBOOK_BASE_URL:https://graph.facebook.com}
    otp:
      ttl-minutes: ${OTP_TTL_MINUTES:10}
      max-attempts: ${OTP_MAX_ATTEMPTS:5}
  sms:
    provider: ${SMS_PROVIDER:local}
    # O provedor "local" registra no log; o código só aparece se isto for ligado em desenvolvimento.
    log-body: ${SMS_LOG_BODY:false}
    from: ${SMS_FROM:}
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      base-url: ${TWILIO_BASE_URL:https://api.twilio.com}
    generic:
      url: ${SMS_GENERIC_URL:}
      token: ${SMS_GENERIC_TOKEN:}
  openai:
    base-url: ${OPENAI_BASE_URL:https://api.openai.com}
    model: ${OPENAI_MODEL:gpt-4o-mini}
  mail:
    provider: ${MAIL_PROVIDER:log}
    # O provedor "log" registra no log; links/tokens só aparecem se isto for ligado em desenvolvimento.
    log-body: ${MAIL_LOG_BODY:false}
    from: ${MAIL_FROM:}
  mercadopago:
    webhook-secret: ${MERCADOPAGO_WEBHOOK_SECRET:}
    # Janela aceita para o `ts` da assinatura (o provedor manda em milissegundos). Fora dela, 401.
    webhook-tolerance-seconds: ${MERCADOPAGO_WEBHOOK_TOLERANCE_SECONDS:300}
    base-url: ${MERCADOPAGO_BASE_URL:https://api.mercadopago.com}
    # A URL de notificação NÃO é configurável por ambiente: a API de Orders recusa
    # `notification_url` no corpo (400 unsupported_properties) e o Mercado Pago chama a URL
    # registrada no painel do app, no evento "Order".
    # Vinculação de aplicações (OAuth): cada loja conecta a própria conta. client-id/secret são da
    # aplicação App-Checkout-Transparente-Foodie; o redirect é fixo e cadastrado na aplicação.
    client-id: ${MERCADOPAGO_CLIENT_ID:}
    client-secret: ${MERCADOPAGO_CLIENT_SECRET:}
    oauth-redirect-uri: ${MERCADOPAGO_OAUTH_REDIRECT_URI:}
    auth-base-url: ${MERCADOPAGO_AUTH_BASE_URL:https://auth.mercadopago.com.br}
  mapbox:
    token: ${MAPBOX_TOKEN:}
    base-url: ${MAPBOX_BASE_URL:https://api.mapbox.com}
  webpush:
    public-key: ${WEBPUSH_PUBLIC_KEY:}
    private-key: ${WEBPUSH_PRIVATE_KEY:}
    subject: ${WEBPUSH_SUBJECT:mailto:contato@foodie.local}
  fcm:
    service-account-json: ${FCM_SERVICE_ACCOUNT_JSON:}
    project-id: ${FCM_PROJECT_ID:}
  storage:
    driver: ${STORAGE_DRIVER:local}
    local-dir: ${STORAGE_LOCAL_DIR:./data/uploads}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://127.0.0.1:4001}
    max-image-bytes: ${STORAGE_MAX_IMAGE_BYTES:5242880}
    max-document-bytes: ${STORAGE_MAX_DOCUMENT_BYTES:10485760}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:}
  release: ${SENTRY_RELEASE:}
  send-default-pii: false
  max-request-body-size: none
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.0}
logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requestId:-sem-id}] %logger{36} - %msg%n"
spring:
  application:
    name: foodie-api
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 12
    baseline-description: baseline antes das migrations do Flyway
  datasource:
    url: jdbc:mariadb://${DB_HOST:127.0.0.1}:${DB_PORT:3307}/${DB_NAME:foodie_platform}
    username: ${DB_USER:foodie}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 8
      minimum-idle: 1
      connection-timeout: 5000
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
