server:
  port: ${API_PORT:4001}
  address: ${API_HOST:127.0.0.1}
app:
  cookie-secure: ${COOKIE_SECURE:false}
  public-base-url: ${PUBLIC_BASE_URL:http://127.0.0.1:3001}
  migrate-only: ${MIGRATE_ONLY:false}
  payments:
    default-provider: ${PAYMENTS_DEFAULT_PROVIDER:mercadopago}
    # Caminho de teste/homologação: permite criar cobrança online nova (hoje o produto exige
    # recebimento direto pelo restaurante). Em produção fica desligado.
    allow-direct-online-charges: ${PAYMENTS_ALLOW_DIRECT_ONLINE_CHARGES:false}
  auth:
    require-email-verification: ${REQUIRE_EMAIL_VERIFICATION:true}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      base-url: ${GOOGLE_BASE_URL:https://oauth2.googleapis.com}
    facebook:
      app-id: ${FACEBOOK_APP_ID:}
      base-url: ${FACEBOOK_BASE_URL:https://graph.facebook.com}
    otp:
      ttl-minutes: ${OTP_TTL_MINUTES:10}
      max-attempts: ${OTP_MAX_ATTEMPTS:5}
  sms:
    provider: ${SMS_PROVIDER:local}
    from: ${SMS_FROM:}
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      base-url: ${TWILIO_BASE_URL:https://api.twilio.com}
    generic:
      url: ${SMS_GENERIC_URL:}
      token: ${SMS_GENERIC_TOKEN:}
  openai:
    base-url: ${OPENAI_BASE_URL:https://api.openai.com}
    model: ${OPENAI_MODEL:gpt-4o-mini}
  mail:
    provider: ${MAIL_PROVIDER:log}
    from: ${MAIL_FROM:}
  mobile:
    payment-return-url: ${MOBILE_PAYMENT_RETURN_URL:}
  mercadopago:
    access-token: ${MERCADOPAGO_ACCESS_TOKEN:}
    webhook-secret: ${MERCADOPAGO_WEBHOOK_SECRET:}
    base-url: ${MERCADOPAGO_BASE_URL:https://api.mercadopago.com}
    notification-url: ${MERCADOPAGO_NOTIFICATION_URL:}
    # Ambiente de teste: usa o ponto de entrada de sandbox na preferência (o de produção recusa
    # cartão de teste). O script de credencial grava isto conforme o que a conta é.
    sandbox: ${MERCADOPAGO_SANDBOX:false}
    # Public key da aplicação: vai para o navegador e tokeniza o cartão no checkout transparente
    # (o número do cartão nunca passa pelo nosso servidor). Não é segredo.
    public-key: ${MERCADOPAGO_PUBLIC_KEY:}
  mapbox:
    token: ${MAPBOX_TOKEN:}
    base-url: ${MAPBOX_BASE_URL:https://api.mapbox.com}
  webpush:
    public-key: ${WEBPUSH_PUBLIC_KEY:}
    private-key: ${WEBPUSH_PRIVATE_KEY:}
    subject: ${WEBPUSH_SUBJECT:mailto:contato@foodie.local}
  fcm:
    service-account-json: ${FCM_SERVICE_ACCOUNT_JSON:}
    project-id: ${FCM_PROJECT_ID:}
  storage:
    driver: ${STORAGE_DRIVER:local}
    local-dir: ${STORAGE_LOCAL_DIR:./data/uploads}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://127.0.0.1:4001}
    max-image-bytes: ${STORAGE_MAX_IMAGE_BYTES:5242880}
    max-document-bytes: ${STORAGE_MAX_DOCUMENT_BYTES:10485760}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requestId:-sem-id}] %logger{36} - %msg%n"
spring:
  application:
    name: foodie-api
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 12
    baseline-description: baseline antes das migrations do Flyway
  datasource:
    url: jdbc:mariadb://${DB_HOST:127.0.0.1}:${DB_PORT:3307}/${DB_NAME:foodie_platform}
    username: ${DB_USER:foodie}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 8
      minimum-idle: 1
      connection-timeout: 5000
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
